name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests & detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Static analysis
        run: ./gradlew detekt

      - name: Configure stable Android signing
        env:
          FRIDAY_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
          FRIDAY_SIGNING_STORE_PASSWORD: ${{ secrets.FRIDAY_SIGNING_STORE_PASSWORD }}
          FRIDAY_SIGNING_KEY_ALIAS: ${{ secrets.FRIDAY_SIGNING_KEY_ALIAS }}
          FRIDAY_SIGNING_KEY_PASSWORD: ${{ secrets.FRIDAY_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$FRIDAY_KEYSTORE_BASE64" || -z "$FRIDAY_SIGNING_STORE_PASSWORD" || -z "$FRIDAY_SIGNING_KEY_ALIAS" || -z "$FRIDAY_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Configure os quatro secrets de assinatura para gerar um APK atualizável."
            exit 1
          fi
          printf "%s" "$FRIDAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/friday.keystore"
          echo "FRIDAY_SIGNING_STORE_FILE=$RUNNER_TEMP/friday.keystore" >> "$GITHUB_ENV"
          echo "FRIDAY_SIGNING_STORE_PASSWORD=$FRIDAY_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FRIDAY_SIGNING_KEY_ALIAS=$FRIDAY_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FRIDAY_SIGNING_KEY_PASSWORD=$FRIDAY_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Friday-PT-BR-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # R8 can break JNI-reached code without failing the build; the check
      # fails it instead (see verifyReleaseKeepRules in app/build.gradle.kts).
      # CI has no signing secrets, so this release is unsigned on purpose: it
      # proves the build, not a distributable APK (see keystore/README.md).
      - name: Release build + R8 keep-rule check
        run: ./gradlew assembleRelease verifyReleaseKeepRules

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
